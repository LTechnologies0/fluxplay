[workspace]
resolver = "2"
members = [
    "crates/fluxplay-core",
    "crates/fluxplay-providers",
    "crates/fluxplay-player",
    "crates/fluxplay-ffi",
    "crates/fluxplay",
]
default-members = ["crates/fluxplay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["FluxPlay"]
repository = "https://github.com/fluxplay/fluxplay"

[workspace.dependencies]
fluxplay-core = { path = "crates/fluxplay-core" }
fluxplay-providers = { path = "crates/fluxplay-providers" }
fluxplay-player = { path = "crates/fluxplay-player" }
fluxplay-ffi = { path = "crates/fluxplay-ffi" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
quick-xml = { version = "0.37", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
dirs = "6"
rfd = "0.15"
open = "5"
