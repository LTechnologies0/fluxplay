[workspace]
resolver = "2"
members = [
    "crates/fluxplay-core",
    "crates/fluxplay-providers",
    "crates/fluxplay-player",
    "crates/fluxplay-ffi",
    "crates/fluxplay",
    "crates/fluxplay-android",
]
default-members = ["crates/fluxplay"]

[workspace.package]
version = "0.2.11"
edition = "2021"
license = "MIT"
authors = ["FluxPlay"]
repository = "https://github.com/fluxplay/fluxplay"

[workspace.dependencies]
fluxplay-core = { path = "crates/fluxplay-core" }
fluxplay-providers = { path = "crates/fluxplay-providers" }
fluxplay-player = { path = "crates/fluxplay-player", default-features = false }
fluxplay-ffi = { path = "crates/fluxplay-ffi" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies", "socks"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config", "tls-ring", "https-ring", "webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
quick-xml = { version = "0.37", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
iced = { version = "0.14", default-features = false, features = ["wgpu", "crisp", "web-colors", "tokio", "image", "svg", "advanced"] }
dirs = "6"
rfd = "0.15"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
zip = "2"

[patch.crates-io]
iced = { path = "vendor/iced" }
iced_winit = { path = "vendor/iced_winit" }
iced_widget = { path = "vendor/iced_widget" }

# ── Release binaries: max opt, dead-code elimination, stripped ──────────────
# Default: `cargo build --release` / `cargo install`
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

# Smaller download (CLI-style): prefer size over peak speed
#   cargo build --profile release-size -p fluxplay
[profile.release-size]
inherits = "release"
opt-level = "z"
strip = "symbols"

# Faster CI compile while still better than stock release
#   cargo build --profile release-ci -p fluxplay
[profile.release-ci]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = "symbols"

# Dev: speed up heavy deps without slowing your edit–compile loop too much
[profile.dev.package."*"]
opt-level = 1

