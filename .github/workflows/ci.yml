name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege — build jobs only need contents read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Never resolve past Cargo.lock in CI.
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: supply-chain
      - name: cargo-deny + lockfile
        run: |
          chmod +x scripts/supply-chain.sh scripts/resource-budget.sh
          cargo install cargo-deny --locked
          ./scripts/supply-chain.sh
      - name: clippy (strict)
        run: |
          cargo clippy --workspace --locked --lib --exclude fluxplay-android -- \
            -D warnings -A dead_code

  desktop:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            require_libmpv: "1"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            require_libmpv: "1"
          # Cross-compile Intel macOS from Apple Silicon runners (macos-13 often starved).
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            require_libmpv: "0"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            require_libmpv: "1"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            require_libmpv: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libgl1-mesa-dev \
            libgtk-3-dev \
            libmpv-dev

      - name: Install macOS libmpv
        if: runner.os == 'macOS'
        run: brew install mpv pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build desktop app
        env:
          FLUXPLAY_BUNDLE_RPATH: "1"
          FLUXPLAY_REQUIRE_LIBMPV: ${{ matrix.require_libmpv }}
        # Thin LTO profile — faster CI while still optimized/stripped
        run: cargo build -p fluxplay --profile release-ci --locked --target ${{ matrix.target }}

      - name: Test workspace (host arch only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo test --workspace --exclude fluxplay --locked

  # Compile-time denies + proptest + libFuzzer (resource-capped).
  tdd-gate:
    name: tdd-gate
    runs-on: ubuntu-latest
    needs: [supply-chain]
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GUI deps + clang (libFuzzer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libgl1-mesa-dev \
            libgtk-3-dev \
            libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tdd-gate
      - name: TDD gate (-D warnings + property tests + fuzz)
        env:
          FLUXPLAY_SUPPLY_CHAIN: "0"
          FLUXPLAY_CLIPPY: "0"
          FLUXPLAY_FUZZ: "1"
          FLUXPLAY_FUZZ_SECS: "8"
          FLUXPLAY_JOBS: "2"
          FLUXPLAY_FUZZ_JOBS: "2"
          FLUXPLAY_FUZZ_RSS_MB: "1024"
          PROPTEST_CASES: "512"
        run: |
          chmod +x scripts/tdd-gate.sh scripts/fuzz-common.sh scripts/resource-budget.sh scripts/supply-chain.sh
          cargo install cargo-fuzz --locked
          ./scripts/tdd-gate.sh

  android-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build FFI host
        run: cargo build -p fluxplay-ffi --locked
      # Android NDK not installed by default — keep informational.
      - name: Build FFI Android aarch64 (best-effort)
        run: |
          rustup target add aarch64-linux-android
          cargo build -p fluxplay-ffi --locked --target aarch64-linux-android
        continue-on-error: true

  # Full APK needs SDK + NDK + cargo-apk; check is the required gate.
  android-apk:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-x86_64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Android check
        env:
          CC_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          AR_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
        run: |
          rustup target add x86_64-linux-android
          cargo check -p fluxplay --locked --target x86_64-linux-android

      - name: Setup Android SDK cmdline-tools (optional APK)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34
        continue-on-error: true

      - name: Add Android build-tools to PATH (optional APK)
        if: steps.setup-ndk.outcome == 'success'
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
        continue-on-error: true

      - name: Install cargo-apk (optional)
        if: steps.setup-ndk.outcome == 'success'
        run: cargo install cargo-apk --locked
        continue-on-error: true

      - name: Build APK x86_64 (optional)
        if: steps.setup-ndk.outcome == 'success'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x scripts/build-android-apk.sh scripts/inject-android-java.sh
          # Debug keystore for CI signing metadata in cargo-apk config.
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./scripts/build-android-apk.sh --target x86_64-linux-android
        continue-on-error: true

      - name: Upload APK artifact (if built)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fluxplay-android-x86_64
          path: |
            target/**/apk/FluxPlay.apk
          if-no-files-found: ignore
        continue-on-error: true
