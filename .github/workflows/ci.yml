name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            require_libmpv: "1"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            require_libmpv: "1"
          # Cross-compile Intel macOS from Apple Silicon runners (macos-13 often starved).
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            require_libmpv: "0"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            require_libmpv: "1"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            require_libmpv: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libgl1-mesa-dev \
            libgtk-3-dev \
            libmpv-dev

      - name: Install macOS libmpv
        if: runner.os == 'macOS'
        run: brew install mpv pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build desktop app
        env:
          FLUXPLAY_BUNDLE_RPATH: "1"
          FLUXPLAY_REQUIRE_LIBMPV: ${{ matrix.require_libmpv }}
        # Thin LTO profile — faster CI while still optimized/stripped
        run: cargo build -p fluxplay --profile release-ci --target ${{ matrix.target }}

      - name: Test workspace (host arch only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo test --workspace --exclude fluxplay

  android-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build FFI host
        run: cargo build -p fluxplay-ffi
      # Android NDK not installed by default — keep informational.
      - name: Build FFI Android aarch64 (best-effort)
        run: |
          rustup target add aarch64-linux-android
          cargo build -p fluxplay-ffi --target aarch64-linux-android
        continue-on-error: true

  # Full APK needs SDK + NDK + cargo-apk; check is the required gate.
  android-apk:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-x86_64-linux-android

      - name: Android check
        run: |
          rustup target add x86_64-linux-android
          cargo check -p fluxplay --target x86_64-linux-android

      - name: Setup Android NDK (optional APK)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
        continue-on-error: true

      - name: Setup Android SDK cmdline-tools (optional APK)
        if: steps.setup-ndk.outcome == 'success'
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install cargo-apk (optional)
        if: steps.setup-ndk.outcome == 'success'
        run: cargo install cargo-apk --locked
        continue-on-error: true

      - name: Build APK x86_64 (optional)
        if: steps.setup-ndk.outcome == 'success'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x scripts/build-android-apk.sh scripts/inject-android-java.sh
          # Debug keystore for CI signing metadata in cargo-apk config.
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./scripts/build-android-apk.sh --target x86_64-linux-android
        continue-on-error: true

      - name: Upload APK artifact (if built)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fluxplay-android-x86_64
          path: |
            target/**/apk/FluxPlay.apk
          if-no-files-found: ignore
        continue-on-error: true
