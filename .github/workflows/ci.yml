name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            require_libmpv: "1"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            require_libmpv: "1"
          # Cross-compile Intel macOS from Apple Silicon runners (macos-13 often starved).
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            require_libmpv: "0"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            require_libmpv: "1"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            require_libmpv: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libgl1-mesa-dev \
            libgtk-3-dev \
            libmpv-dev

      - name: Install macOS libmpv
        if: runner.os == 'macOS'
        run: brew install mpv pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build desktop app
        env:
          FLUXPLAY_BUNDLE_RPATH: "1"
          FLUXPLAY_REQUIRE_LIBMPV: ${{ matrix.require_libmpv }}
        # Thin LTO profile — faster CI while still optimized/stripped
        run: cargo build -p fluxplay --profile release-ci --target ${{ matrix.target }}

      - name: Test workspace (host arch only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo test --workspace --exclude fluxplay

  android-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build FFI host
        run: cargo build -p fluxplay-ffi
      # Android NDK not installed by default — keep informational.
      - name: Build FFI Android aarch64 (best-effort)
        run: |
          rustup target add aarch64-linux-android
          cargo build -p fluxplay-ffi --target aarch64-linux-android
        continue-on-error: true
