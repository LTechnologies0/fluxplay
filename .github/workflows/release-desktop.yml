name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: fluxplay-linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: fluxplay
            require_libmpv: "1"
          - artifact: fluxplay-linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: fluxplay
            require_libmpv: "1"
          # Intel macOS is cross-built on Apple Silicon runners — host brew libmpv is arm64.
          - artifact: fluxplay-macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: fluxplay
            require_libmpv: "0"
          - artifact: fluxplay-macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: fluxplay
            require_libmpv: "1"
          - artifact: fluxplay-windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: fluxplay.exe
            require_libmpv: "0"
    runs-on: ${{ matrix.os }}
    # Intel macOS cross-build is flaky (host brew libmpv is arm64).
    continue-on-error: ${{ matrix.target == 'x86_64-apple-darwin' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libgl1-mesa-dev \
            libgtk-3-dev \
            libmpv-dev

      - name: Install macOS libmpv
        if: runner.os == 'macOS'
        run: brew install mpv pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          FLUXPLAY_BUNDLE_RPATH: "1"
          FLUXPLAY_REQUIRE_LIBMPV: ${{ matrix.require_libmpv }}
        run: cargo build -p fluxplay --release --target ${{ matrix.target }}

      - name: Bundle libmpv (Unix shared)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/bundle-libmpv.sh
          scripts/bundle-libmpv.sh "target/${{ matrix.target }}/release/${{ matrix.bin }}" || true

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}/fluxplay"
          chmod +x "dist/${{ matrix.artifact }}/fluxplay"
          if [[ -d "target/${{ matrix.target }}/release/lib" ]]; then
            cp -a "target/${{ matrix.target }}/release/lib" "dist/${{ matrix.artifact }}/"
          fi
          (cd dist && tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}")
          (cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}.exe"
          Compress-Archive -Path "dist/${{ matrix.artifact }}.exe" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force
          Get-FileHash "dist/${{ matrix.artifact }}.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  ${{ matrix.artifact }}.zip" } |
            Set-Content "dist/${{ matrix.artifact }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # Optional Android APK for tagged releases — continue-on-error (NDK/SDK heavy).
  android-apk:
    name: android-apk (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-apk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build-android-apk.sh scripts/inject-android-java.sh
          # apktool improves PiP manifest patch reliability during inject.
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool || true
          ./scripts/build-android-apk.sh --target aarch64-linux-android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxplay-android-aarch64
          path: |
            target/**/apk/FluxPlay.apk
          if-no-files-found: warn

  release:
    needs: [build, android-apk]
    # Publish whatever targets succeeded (matrix fail-fast=false; android is optional).
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
