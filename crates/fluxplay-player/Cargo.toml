[package]
name = "fluxplay-player"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Protocol router and stream session manager for FluxPlay"

[features]
default = ["native-mpv", "native-ffmpeg", "cli-player", "bundle-rpath"]
# In-process libmpv FFI (standalone — no `mpv` binary required at runtime).
native-mpv = []
# In-process FFmpeg (libav*) demux/decode → RGBA embedded in iced (like libmpv SW).
native-ffmpeg = []
# Prefer linking `libmpv.a` (+ optional FLUXPLAY_MPV_STATIC_DEPS).
static-link = ["native-mpv"]
# Embed `$ORIGIN/lib` rpath so a bundled `lib/libmpv.so` resolves next to the binary.
bundle-rpath = ["native-mpv"]
# Keep spawning system `mpv`/`ffplay` as fallback (emergency only when native FFmpeg missing).
cli-player = []
# Expose pure parse/route helpers for cargo-fuzz (no native decode required).
fuzzing = []

[dependencies]
fluxplay-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
proptest = { workspace = true }

[build-dependencies]
cc = "1"

[lints]
workspace = true
