[package]
name = "fluxplay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FluxPlay — cross-platform IPTV media player (Material Expressive)"

[lib]
name = "fluxplay"
path = "src/lib.rs"

[[bin]]
name = "fluxplay"
path = "src/main.rs"
required-features = ["native-player"]

[features]
default = ["native-player"]
native-player = [
    "fluxplay-player/native-mpv",
    "fluxplay-player/native-ffmpeg",
    "fluxplay-player/cli-player",
    "fluxplay-player/bundle-rpath",
]
static-mpv = ["fluxplay-player/static-link", "fluxplay-player/bundle-rpath"]

[dependencies]
fluxplay-core.workspace = true
fluxplay-providers.workspace = true
fluxplay-player = { workspace = true }
anyhow.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
open.workspace = true
url.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
image.workspace = true
zip.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
iced = { workspace = true, features = ["x11", "wayland", "linux-theme-detection", "tiny-skia"] }
rfd.workspace = true
dark-light = "2"
# Userspace WireGuard → local SOCKS5 (app-only tunnel, no system routes).
wg-socks = "0.1.1"

[target.'cfg(target_os = "android")'.dependencies]
# advanced-shaping: iced docs — Auto uses Basic for ASCII (no font fallback),
# which paints empty pills on Android GLES; Advanced is the correct default.
iced = { workspace = true, features = ["android-native-activity", "fira-sans", "advanced-shaping"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"
tracing-log = "0.2"
jni = "0.21"
ndk-context = "0.1"
# Same userspace WG → SOCKS as desktop (no VpnService required for app-scoped egress).
wg-socks = "0.1.1"
