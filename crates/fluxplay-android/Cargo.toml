[package]
name = "fluxplay-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FluxPlay Android / Android TV — iced NativeActivity (same UI as desktop)"
publish = false

[lib]
crate-type = ["cdylib"]
name = "fluxplay_android"
path = "src/lib.rs"

[dependencies]
fluxplay = { path = "../fluxplay", default-features = false, features = ["native-player"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

####################
# cargo-apk config #
####################

[package.metadata.android]
package = "app.fluxplay.android"
apk_name = "FluxPlay"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Pack vendored libmpv.so (media-kit) into the APK for in-process embed.
runtime_libs = "../../vendor/android-native"
resources = "res"
icon = "@mipmap/ic_launcher"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

# Package visibility (API 31+): one <data> type per <intent> (install reject otherwise).
[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.VIEW"]
data = [{ mime_type = "video/*" }]

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.VIEW"]
data = [{ mime_type = "audio/*" }]

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.VIEW"]
data = [{ mime_type = "*/*" }]

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.VIEW"]
data = [{ scheme = "https" }]

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.VIEW"]
data = [{ scheme = "http" }]

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.OPEN_DOCUMENT"]
data = [{ mime_type = "*/*" }]

[[package.metadata.android.queries.intent]]
actions = ["android.intent.action.CREATE_DOCUMENT"]
data = [{ mime_type = "*/*" }]

[package.metadata.android.application]
label = "FluxPlay"
icon = "@mipmap/ic_launcher"
# TV leanback row image (also under resources/drawable/banner.png).
# Translucent so MediaCodec SurfaceView can show under iced chrome (Phase A).
theme = "@style/FluxPlay.Transparent"
# Prefer false for store/release; local debug builds can still use adb jdwp via NDK.
debuggable = false
uses_cleartext_traffic = true
# Java subclass (SAF / PiP / insets) — inject classes.dex via scripts/inject-android-java.sh
has_code = true

# cargo-apk does not expand ~ or $HOME. Use a crate-local keystore (gitignored);
# scripts/build-android-apk.sh and CI ensure it exists before `cargo apk build`.
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"

[package.metadata.android.signing.release-ci]
path = "debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"

[package.metadata.android.application.activity]
name = "app.fluxplay.android.FluxPlayNativeActivity"
exported = true
# Survive rotate / fold / density without Activity recreate — Java onConfigurationChanged
# refreshes insets + Surface; Rust rebinds wid / caps.
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density|smallestScreenSize|keyboard|layoutDirection"
# Auto-rotate with the sensor (portrait ↔ landscape ↔ reverse) when system allows.
orientation = "fullSensor"
launch_mode = "singleTop"
resizeable_activity = true
always_retain_task_state = true
# supportsPictureInPicture not in cargo-apk Activity schema — patched by scripts/inject-android-java.sh

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "fluxplay_android"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LEANBACK_LAUNCHER"]
